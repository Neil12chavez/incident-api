name: Continuous Integration Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8
    - name: Analizar código con Flake8 (Linter)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Compilar imagen de prueba
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false

  sonarcloud-analysis:
    runs-on: ubuntu-latest
    needs: build-docker # Opcional: espera a que Docker compile bien
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Crucial para que SonarCloud lea el historial

      - name: Escaneo de SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}