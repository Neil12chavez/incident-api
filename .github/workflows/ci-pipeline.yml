name: Continuous Integration Pipeline

# El pipeline se activa ante cualquier push o pull request en las ramas principales
on:
  push:
    branches: [ "main", "develop", "feature/*" ] # Ahora reaccionará a tus pushes en ramas de feature
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # Trabajo 1: Validar la calidad del código Python
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Versión estándar para FastAPI

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 # Linter para asegurar buenas prácticas de sintaxis

    - name: Analizar código con Flake8 (Linter)
      run: |
        # Detiene la ejecución si hay errores de sintaxis de Python o variables no definidas
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Advertencias de estilo (opcional, no rompe el pipeline)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # Trabajo 2: Validar que el Dockerfile compila correctamente
  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test # Solo se ejecuta si el código pasa las pruebas de sintaxis
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Compilar imagen de prueba (Sin subirla al registro)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false # Solo simula el build para validar que el Dockerfile no falle